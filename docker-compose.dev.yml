services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dashboard-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - work_files_dev:/app/private/work
      - finance_files_dev:/app/private/finance
    env_file:
      - .env
    environment:
      NODE_ENV: development
      EMAIL_ENABLED: ${DEV_EMAIL_ENABLED:-false}
      PUSH_ENABLED: ${DEV_PUSH_ENABLED:-false}
      FINANCE_UPLOAD_DIR: /app/private/finance
      WORK_UPLOAD_DIR: /app/private/work
    command: sh -c "npx prisma migrate deploy && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    depends_on:
      dashboard-db:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      EMAIL_ENABLED: ${DEV_EMAIL_ENABLED:-false}
      EMAIL_APP_URL: http://dashboard:3000
      PUSH_ENABLED: ${DEV_PUSH_ENABLED:-false}
    command: ["node", "scripts/notification-worker.mjs"]
    stop_grace_period: 30s
    depends_on:
      dashboard:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  dashboard-db:
    image: postgres:15
    container_name: dashboard-db-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dashboard_data_dev:/var/lib/postgresql/data

volumes:
  work_files_dev:
  finance_files_dev:
  dashboard_data_dev:
