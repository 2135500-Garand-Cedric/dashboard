services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dashboard-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - finance_files_dev:/app/private/finance
    env_file:
      - .env
    environment:
      NODE_ENV: development
      FINANCE_UPLOAD_DIR: /app/private/finance
    command: sh -c "npx prisma migrate deploy && npm run seed && npm run dev"
    depends_on:
      dashboard-db:
        condition: service_healthy

  dashboard-db:
    image: postgres:15
    container_name: dashboard-db-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dashboard_data_dev:/var/lib/postgresql/data

volumes:
  finance_files_dev:
  dashboard_data_dev:
