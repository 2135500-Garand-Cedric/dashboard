services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?Set DASHBOARD_IMAGE in .env to the published GHCR image}
    container_name: dashboard
    restart: unless-stopped
    networks:
      - web-network
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FINANCE_UPLOAD_DIR: /app/private/finance
      WORK_UPLOAD_DIR: /app/private/work
    volumes:
      - work_files:/app/private/work
      - finance_files:/app/private/finance
    command: sh -c "npx prisma migrate deploy && npm run start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    depends_on:
      dashboard-db:
        condition: service_healthy

  notification-worker:
    image: ${DASHBOARD_IMAGE:?Set DASHBOARD_IMAGE in .env to the published GHCR image}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["node", "scripts/notification-worker.mjs"]
    stop_grace_period: 30s
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - web-network

  dashboard-db:
    image: postgres:15
    container_name: dashboard-db
    restart: always
    networks:
      - web-network
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dashboard_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: dashboard-pgadmin
    restart: always
    networks:
      - web-network
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: cedricgarand@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      dashboard-db:
        condition: service_healthy

volumes:
  work_files:
  finance_files:
  dashboard_data:

networks:
  web-network:
    external: true
