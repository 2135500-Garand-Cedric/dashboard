services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: dashboard
    restart: unless-stopped
    networks:
      - web-network
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FINANCE_UPLOAD_DIR: /app/private/finance
    volumes:
      - finance_files:/app/private/finance
    command: sh -c "npx prisma migrate deploy && npm run start"
    depends_on:
      dashboard-db:
        condition: service_healthy

  dashboard-db:
    image: postgres:15
    container_name: dashboard-db
    restart: always
    networks:
      - web-network
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dashboard_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: dashboard-pgadmin
    restart: always
    networks:
      - web-network
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: cedricgarand@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      dashboard-db:
        condition: service_healthy

volumes:
  finance_files:
  dashboard_data:

networks:
  web-network:
    external: true
